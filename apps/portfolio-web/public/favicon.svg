<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1b3f" />
      <stop offset="50%" stop-color="#07132b" />
      <stop offset="100%" stop-color="#040b1a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce29d" />
      <stop offset="50%" stop-color="#f2c46d" />
      <stop offset="100%" stop-color="#c99738" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Elegant Border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="12" opacity="0.85" />
  <!-- Inner Subtle Accent Border -->
  <rect x="36" y="36" width="440" height="440" rx="82" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.25" />

  <!-- Monogram Initials "KB" -->
  <g filter="url(#subtleGlow)">
    <text
      x="256"
      y="325"
      text-anchor="middle"
      font-family="'Playfair Display', 'Cinzel', 'Georgia', serif"
      font-size="230"
      font-weight="700"
      letter-spacing="2"
      fill="url(#goldGrad)"
    >KB</text>
  </g>

  <!-- Elegant Decorative Divider Bar -->
  <rect x="180" y="365" width="152" height="8" rx="4" fill="url(#goldGrad)" opacity="0.9" />
</svg>
